<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtoZ Cinemas - Your Movie Paradise</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px; /* Mobile app style width frame */
            background: #0b0f19;
        }
        /* Header Section */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            background: #f59e0b;
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .logo-text h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }
        .logo-text p {
            font-size: 10px;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .search-btn {
            background: #1e293b;
            color: #94a3b8;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .nav-tabs::-webkit-scrollbar {
            display: none;
        }
        .tab {
            background: #1e293b;
            color: #94a3b8;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab.active {
            background: #f59e0b;
            color: #000;
        }

        /* Section Heading */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        /* Movie Grid Layout (2 Columns) */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .movie-card {
            background: #131b2e;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .poster-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #1e293b;
        }
        .poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f59e0b;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .movie-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            justify-content: space-between;
        }
        .movie-title {
            font-size: 13px;
            font-weight: 600;
            color: #f8fafc;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .movie-year {
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">🎬</div>
                <div class="logo-text">
                    <h1>ATOZ CINEMAS</h1>
                    <p>YOUR MOVIE PARADISE</p>
                </div>
            </div>
            <button class="search-btn">
                🔍 Search
            </button>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab active">Home</button>
            <button class="tab">Movies</button>
            <button class="tab">Series</button>
            <button class="tab">Anime</button>
        </div>

        <!-- Trending Section -->
        <div class="section-title">
            🔥 TRENDING THIS WEEK
        </div>

        <!-- Movie Cards Grid -->
        <div class="main-content">
            <div class="movie-grid">
                
                <!-- Card 1 -->
                <div class="movie-card">
                    <div class="poster-container">
                        <span class="badge">Movie</span>
                        <!-- Yahan aap apni movie poster image ka link daal sakte hain -->
                        <div style="width:100%;height:100%;background:#26334d;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;">Poster 1</div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">Drishyam The Conclusion 2026 HDTC Hindi Esubs</div>
                        <div class="movie-year">2026</div>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="movie-card">
                    <div class="poster-container">
                        <span class="badge">Movie</span>
                        <div style="width:100%;height:100%;background:#26334d;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;">Poster 2</div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">Toxic 2026 WebRip Hindi Kannada Esubs</div>
                        <div class="movie-year">2026</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
