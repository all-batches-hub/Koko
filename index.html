<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtoZ Cinemas - Your Movie Paradise</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #0b0f19;
            position: relative;
            overflow: hidden;
        }
        .sticky-top-section {
            position: sticky;
            top: 0;
            background-color: #0b0f19;
            z-index: 1000;
            padding-top: 5px;
            padding-bottom: 10px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            background: #f59e0b;
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .logo-text h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fbe68a;
        }
        .logo-text p {
            font-size: 9px;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .search-box-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input {
            background: #131b2e;
            color: #ffffff;
            border: 1px solid #1e293b;
            padding: 10px 15px;
            padding-right: 38px;
            border-radius: 25px;
            font-size: 13px;
            width: 150px;
            outline: none;
        }
        .search-input:focus {
            border-color: #f59e0b;
        }
        .search-icon-btn {
            position: absolute;
            right: 5px;
            background: #f59e0b;
            color: #000;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border: none;
            cursor: pointer;
        }
        .nav-box-container {
            background: #131b2e;
            padding: 5px;
            border-radius: 30px;
            display: flex;
            gap: 5px;
            border: 1px solid #1e293b;
            margin-bottom: 10px;
        }
        .tab {
            flex: 1;
            background: transparent;
            color: #94a3b8;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
            border-radius: 20px;
            text-align: center;
            transition: all 0.25s ease;
        }
        .tab.active {
            color: #000;
            background: #f59e0b;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        .movie-card {
            background: #131b2e;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: translateY(-3px);
        }
        .poster-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #1a233a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 11px;
        }
        .badge-movie {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f59e0b;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-show {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #10b981;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-season {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #3b82f6;
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .movie-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            justify-content: space-between;
        }
        .movie-title {
            font-size: 12px;
            font-weight: 500;
            color: #f8fafc;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .movie-year {
            font-size: 11px;
            color: #94a3b8;
        }
        .no-results {
            grid-column: span 2;
            text-align: center;
            color: #94a3b8;
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <div class="sticky-top-section">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon">🎬</div>
                    <div class="logo-text">
                        <h1>ATOZ CINEMAS</h1>
                        <p>YOUR MOVIE PARADISE</p>
                    </div>
                </div>
                <div class="search-box-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search..." onkeyup="filterContent()">
                    <button class="search-icon-btn">🔍</button>
                </div>
            </div>

            <!-- Navigation Tabs: contentList ki categories se automatically banenge -->
            <div class="nav-box-container" id="navTabs"></div>
        </div>

        <div class="movie-grid" id="movieGrid"></div>

    </div>

    <script>
        // =========================================================
        //               SINGLE CONTENT LIST
        // =========================================================
        // बस यहीं नया Movie या Series जोड़ें।
        //
        // category:
        //   "movies" -> Movies section
        //   "series" -> Series section
        //   "anime" -> Anime section
        //   "bollywood" -> Bollywood section
        //   Future me koi bhi category -> automatic section
        //
        // ID जितना बड़ा होगा, content उतना ऊपर दिखाई देगा।
        // =========================================================

        const contentList = [
    { 
        id: 4,
        title: " Drishyam The Conclusion 2026 HDTC Hindi Esubs 2026", 
        year: "2026", 
        category: "series", 
        badgeType: "movie", 
        badgeText: "MOVIE", 
        season: "Part-01", 
        poster: "https://atoz.cinemaz.workers.dev/drishyam-the-conclusion-2026-hdtc-hindi-esubs", 
        url: "https://atoz.cinemaz.workers.dev/drishyam-the-conclusion-2026-hdtc-hindi-esubs" 
    },

            

    { 
        id: 3,
        title: " Drishyam The Conclusion 2026 HDTC Hindi Esubs 2026", 
        year: "2026", 
        category: "series", 
        badgeType: "movie", 
        badgeText: "MOVIE", 
        season: "Part-01", 
        poster: "https://atoz.cinemaz.workers.dev/drishyam-the-conclusion-2026-hdtc-hindi-esubs", 
        url: "https://atoz.cinemaz.workers.dev/drishyam-the-conclusion-2026-hdtc-hindi-esubs" 
    },

    { 
        id: 2,
        title: " Drishyam The Conclusion 2026 HDTC Hindi Esubs 2026", 
        year: "2026", 
        category: "movies", 
        badgeType: "movie", 
        badgeText: "MOVIE", 
        season: "Part-01", 
        poster: "https://atoz.cinemaz.workers.dev/drishyam-the-conclusion-2026-hdtc-hindi-esubs", 
        url: "https://atoz.cinemaz.workers.dev/drishyam-the-conclusion-2026-hdtc-hindi-esubs" 
    },


            
                { 
        id: 1,
        title: " Drishyam The Conclusion 2026 HDTC Hindi Esubs 2026", 
        year: "2026", 
        category: "movies", 
        badgeType: "movie", 
        badgeText: "MOVIE", 
        season: "Part-01", 
        poster: "https://atoz.cinemaz.workers.dev/drishyam-the-conclusion-2026-hdtc-hindi-esubs", 
        url: "https://www.imdb.com/title/tt27050858/mediaviewer/rm4050058242/?ref_=ext_shr_lnk" 
    }



            

        
            // =====================================================
            // नया content इसी format में नीचे paste करें:
            //
            // Movie + Season:
            // {
            //     id: 4,
            //     title: "नई Movie",
            //     year: "2026",
            //     category: "movies",
            //     season: "Part 1",
            //     url: "https://example.com/new-movie"
            // },
            //
            // Series + Season:
            // {
            //     id: 5,
            //     title: "नई Series",
            //     year: "2026",
            //     category: "series",
            //     season: "S01",
            //     url: "https://example.com/new-series"
            // },
            //
            // Season नहीं चाहिए तो season line हटा दें.
            // =====================================================
        ];

        // =========================================================
        // AUTOMATIC SECTIONS
        // =========================================================
        // Naya section banane ke liye sirf content me nayi category likhein.
        //
        // Example:
        // category: "anime"
        // category: "bollywood"
        // category: "hollywood"
        //
        // Section ka button automatically ban jayega.
        // =========================================================

        let tabsOrder = [];
        let currentTab = 'home';

        function getSections() {
            const sections = [];

            contentList.forEach(item => {
                const category = String(item.category || '').trim().toLowerCase();

                if (category && !sections.includes(category)) {
                    sections.push(category);
                }
            });

            return sections;
        }

        function formatSectionName(name) {
            return name
                .replace(/[-_]+/g, ' ')
                .replace(/\b\w/g, letter => letter.toUpperCase());
        }

        function buildNavigation() {
            const nav = document.getElementById('navTabs');

            tabsOrder = ['home', ...getSections()];

            nav.innerHTML = tabsOrder.map(tab => `
                <button class="tab ${tab === 'home' ? 'active' : ''}"
                        onclick="switchTab('${tab}')">
                    ${tab === 'home' ? 'Home' : formatSectionName(tab)}
                </button>
            `).join('');
        }

        // ---------------------------------------------------------
        // Content item ko automatic badge/category ke liye prepare karein
        // ---------------------------------------------------------
        function prepareItem(item) {
            const prepared = { ...item };
            const category = String(prepared.category || 'movies').trim().toLowerCase();
            prepared.category = category;

            if (category === 'movies') {
                prepared.badgeType = 'movie';
                prepared.badgeText = 'MOVIE';
            } else if (category === 'series') {
                prepared.badgeType = 'show';
                prepared.badgeText = 'TV SHOW';
            } else {
                prepared.badgeType = 'show';
                prepared.badgeText = formatSectionName(category).toUpperCase();
            }

            return prepared;
        }

        // ---------------------------------------------------------
        // Cards Render
        // ---------------------------------------------------------
        function renderItems(dataToRender) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            if (dataToRender.length === 0) {
                grid.innerHTML = `<div class="no-results">Koi content nahi mila.</div>`;
                return;
            }

            dataToRender.forEach(rawItem => {
                const item = prepareItem(rawItem);

                // Season UNIVERSAL hai: kisi bhi category me chalega.
                const seasonHTML = item.season
                    ? `<span class="badge-season">${item.season}</span>`
                    : '';

                let badgeHTML = '';

                if (item.badgeType === 'movie') {
                    badgeHTML = `
                        ${seasonHTML}
                        <span class="badge-movie">${item.badgeText}</span>
                    `;
                } else {
                    badgeHTML = `
                        ${seasonHTML}
                        <span class="badge-show">${item.badgeText}</span>
                    `;
                }

                const card = document.createElement('a');
                card.className = 'movie-card';
                card.href = item.url || '#';
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                card.innerHTML = `
                    <div class="poster-container">
                        ${badgeHTML}
                        <span>Poster Image</span>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${item.title}</div>
                        <div class="movie-year">${item.year || ''}</div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function switchTab(tabName) {
            currentTab = tabName;

            const tabButtons = document.querySelectorAll('.tab');

            tabButtons.forEach((button, index) => {
                if (tabsOrder[index] === tabName) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });

            document.getElementById('searchInput').value = '';
            filterContent();
        }

        // ---------------------------------------------------------
        // Search + Automatic Category Filtering
        // ---------------------------------------------------------
        function filterContent() {
            const searchQuery = document
                .getElementById('searchInput')
                .value
                .toLowerCase()
                .trim();

            let combinedList = [...contentList];

            // Home = सभी content
            // बाकी किसी भी section में उसी category का content आएगा।
            if (currentTab !== 'home') {
                combinedList = combinedList.filter(
                    item => String(item.category || '').toLowerCase() === currentTab
                );
            }

            // Search
            if (searchQuery !== '') {
                combinedList = combinedList.filter(item =>
                    item.title.toLowerCase().includes(searchQuery)
                );
            }

            // Latest ID first
            combinedList.sort((a, b) => b.id - a.id);

            renderItems(combinedList);
        }

        // --- Swipe / Slide Gesture Logic (Touch support for mobile) ---
        let touchStartX = 0;
        let touchEndX = 0;

        const container = document.getElementById('appContainer');

        container.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        container.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const threshold = 50; // Minimum swipe distance
            if (touchEndX < touchStartX - threshold) {
                // Swipe Left -> Next Tab
                let currentIndex = tabsOrder.indexOf(currentTab);
                if (currentIndex < tabsOrder.length - 1) {
                    switchTab(tabsOrder[currentIndex + 1]);
                }
            }
            if (touchEndX > touchStartX + threshold) {
                // Swipe Right -> Previous Tab
                let currentIndex = tabsOrder.indexOf(currentTab);
                if (currentIndex > 0) {
                    switchTab(tabsOrder[currentIndex - 1]);
                }
            }
        }

        buildNavigation();
        filterContent();
    </script>

</body>
    </html>
