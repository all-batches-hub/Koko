<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtoZ Cinemaz - Index Directory</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 24px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-top: 0;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        .search-box:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .breadcrumb {
            margin-bottom: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 12px 15px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        li:hover {
            background: #334155;
        }
        a.item-link {
            color: #f8fafc;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        a.item-link:hover {
            color: #38bdf8;
        }
        .meta {
            font-size: 13px;
            color: #94a3b8;
        }
        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📁 AtoZ Cinemaz Index</h1>
        
        <input type="text" id="searchBar" class="search-box" placeholder="Search movies or folders..." onkeyup="filterFiles()">
        
        <div class="breadcrumb" id="currentPath">Current Path: /</div>
        
        <ul id="fileList">
            <li>
                <a class="item-link" href="#" onclick="openFolder('bollywood')">📂 Bollywood Movies</a>
                <span class="meta">Folder</span>
            </li>
            <li>
                <a class="item-link" href="#" onclick="openFolder('hollywood')">📂 Hollywood Movies</a>
                <span class="meta">Folder</span>
            </li>
            <li>
                <a class="item-link" href="#" onclick="openFolder('webseries')">📂 Web Series</a>
                <span class="meta">Folder</span>
            </li>
            <li>
                <a class="item-link" href="https://example.com/movie1.mp4" target="_blank">📄 Action_Movie_2026.mp4</a>
                <span class="meta">1.4 GB</span>
            </li>
        </ul>
    </div>

    <footer>Hosted on GitHub Pages</footer>

    <script>
        // Simple search filter function
        function filterFiles() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let ul = document.getElementById('fileList');
            let li = ul.getElementsByTagName('li');

            for (let i = 0; i < li.length; i++) {
                let a = li[i].getElementsByTagName("a")[0];
                let txtValue = a.textContent || a.innerText;
                if (txtValue.toLowerCase().indexOf(input) > -1) {
                    li[i].style.display = "";
                } else {
                    li[i].style.display = "none";
                }
            }
        }

        function openFolder(folderName) {
            alert("Aapne '" + folderName + "' folder click kiya. Aap yahan aur files ke links add kar sakte hain.");
        }
    </script>

</body>
</html>
