<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtoZ Cinemas - Your Movie Paradise</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #0b0f19;
            position: relative;
        }

        /* Sticky Header Section (Jo scroll karne par upar fix rahega) */
        .sticky-top-section {
            position: sticky;
            top: 0;
            background-color: #0b0f19;
            z-index: 1000;
            padding-top: 5px;
            padding-bottom: 10px;
        }

        /* Header Layout */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            background: #f59e0b;
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .logo-text h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fbe68a;
        }
        .logo-text p {
            font-size: 9px;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .search-box-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input {
            background: #131b2e;
            color: #ffffff;
            border: 1px solid #1e293b;
            padding: 10px 15px;
            padding-right: 38px;
            border-radius: 25px;
            font-size: 13px;
            width: 150px;
            outline: none;
        }
        .search-input:focus {
            border-color: #f59e0b;
        }
        .search-icon-btn {
            position: absolute;
            right: 5px;
            background: #f59e0b;
            color: #000;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border: none;
            cursor: pointer;
        }

        /* Attractive Rounded Box for Navigation Tabs */
        .nav-box-container {
            background: #131b2e;
            padding: 5px;
            border-radius: 30px;
            display: flex;
            gap: 5px;
            border: 1px solid #1e293b;
            margin-bottom: 10px;
        }
        .tab {
            flex: 1;
            background: transparent;
            color: #94a3b8;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
            border-radius: 20px;
            text-align: center;
            transition: all 0.25s ease;
        }
        .tab.active {
            color: #000;
            background: #f59e0b;
        }

        /* Movie Grid Layout */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        .movie-card {
            background: #131b2e;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .poster-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #1a233a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 11px;
        }
        .badge-movie {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f59e0b;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-show {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #10b981;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-season {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #3b82f6;
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .movie-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            justify-content: space-between;
        }
        .movie-title {
            font-size: 12px;
            font-weight: 500;
            color: #f8fafc;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .movie-year {
            font-size: 11px;
            color: #94a3b8;
        }
        .no-results {
            grid-column: span 2;
            text-align: center;
            color: #94a3b8;
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Sticky Top Section (Header + Rounded Tabs Box) -->
        <div class="sticky-top-section">
            <!-- Header -->
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon">🎬</div>
                    <div class="logo-text">
                        <h1>ATOZ CINEMAS</h1>
                        <p>YOUR MOVIE PARADISE</p>
                    </div>
                </div>
                <div class="search-box-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search..." onkeyup="filterContent()">
                    <button class="search-icon-btn">🔍</button>
                </div>
            </div>

            <!-- Rounded Navigation Box -->
            <div class="nav-box-container">
                <button class="tab active" onclick="switchTab('home', this)">Home</button>
                <button class="tab" onclick="switchTab('movies', this)">Movies</button>
                <button class="tab" onclick="switchTab('series', this)">Series</button>
            </div>
        </div>

        <!-- Movie Cards Grid (Yeh scroll hoga) -->
        <div class="movie-grid" id="movieGrid">
            <!-- Dynamic Content loaded via JavaScript -->
        </div>

    </div>

    <script>
        const items = [
            { id: 1, title: "Drishyam The Conclusion 2026 HDTC Hindi Esubs", year: "2026", category: "movies", badgeType: "movie", badgeText: "MOVIE", season: "" },
            { id: 2, title: "Toxic 2026 WebRip Hindi Kannada Esubs", year: "2026", category: "movies", badgeType: "movie", badgeText: "MOVIE", season: "" },
            { id: 3, title: "Vadam 2026 WebRip Hindi Tamil Esubs", year: "2026", category: "movies", badgeType: "movie", badgeText: "MOVIE", season: "" },
            { id: 4, title: "Spider Man: Brand New Day 2026 WebRip Hindi English Esubs", year: "2026", category: "movies", badgeType: "movie", badgeText: "MOVIE", season: "" },
            { id: 5, title: "Insidious: Out of the Further 2026 WebRip Hindi English Esubs", year: "2026", category: "movies", badgeType: "movie", badgeText: "MOVIE", season: "" },
            { id: 6, title: "East of Eden 2026 S01 WebRip Hindi English Esubs", year: "2026", category: "series", badgeType: "show", badgeText: "TV SHOW", season: "S01" },
            { id: 7, title: "Lanterns 2026 S01 WebRip Hindi English Esubs", year: "2026", category: "series", badgeType: "show", badgeText: "TV SHOW", season: "S01" },
            { id: 8, title: "Red Queen 2026 S02 WebRip Hindi English Esubs", year: "2024", category: "series", badgeType: "show", badgeText: "TV SHOW", season: "S02" },
            { id: 9, title: "Debipokkho 2026 S01 WebRip Bengali Esubs", year: "2026", category: "series", badgeType: "show", badgeText: "TV SHOW", season: "S01" }
        ];

        let currentTab = 'home';

        function renderItems(dataToRender) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            if (dataToRender.length === 0) {
                grid.innerHTML = `<div class="no-results">No movies or series found.</div>`;
                return;
            }

            dataToRender.forEach(item => {
                let badgeHTML = '';
                if (item.badgeType === 'movie') {
                    badgeHTML = `<span class="badge-movie">${item.badgeText}</span>`;
                } else if (item.badgeType === 'show') {
                    badgeHTML = `
                        ${item.season ? `<span class="badge-season">${item.season}</span>` : ''}
                        <span class="badge-show">${item.badgeText}</span>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-container">
                        ${badgeHTML}
                        <span>Poster Image</span>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${item.title}</div>
                        <div class="movie-year">${item.year}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchTab(tabName, element) {
            currentTab = tabName;
            
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('searchInput').value = '';
            filterContent();
        }

        function filterContent() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = items.filter(item => {
                if (currentTab === 'home') return true;
                return item.category === currentTab;
            });

            if (searchQuery.trim() !== '') {
                filtered = filtered.filter(item => item.title.toLowerCase().includes(searchQuery));
            }

            renderItems(filtered);
        }

        renderItems(items);
    </script>

</body>
</html>
